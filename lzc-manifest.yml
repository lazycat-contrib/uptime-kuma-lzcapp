application:
  subdomain: uptime-kuma
  upstreams:
    - location: /
      backend: http://uptime-kuma:3001/
  public_path:
    - /
services:
  uptime-kuma:
    # louislam/uptime-kuma:2.5.0
    # upstream: louislam/uptime-kuma:2.5.7
    image: docker.1ms.run/louislam/uptime-kuma:2.5.7
    binds:
      - /lzcapp/var/data:/app/data
